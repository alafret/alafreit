<meta name="google-site-verification" content="ItbEQHPyyCctZvZz1UzovzmIekK73acXnkoKWXUeDvA" />    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #ff0000;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        p {
            color: #aaaaaa;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        .links-title {
            color: #ffffff;
            font-size: 1.2rem;
            margin-bottom: 20px;
            border-bottom: 1px solid #ff0000;
            padding-bottom: 5px;
            display: inline-block;
        }
        .btn {
            display: block;
            background-color: transparent;
            color: #ffffff;
            border: 2px solid #ff0000;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(255, 0, 0, 0.2);
        }
        .btn:hover {
            background-color: #ff0000;
            color: #000000;
            box-shadow: 0 0 15px #ff0000;
            transform: scale(1.03);
        }
    </style>
</head>
